name: Node contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - name: Diagnose failing Windows test files
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem test/*.test.js | ForEach-Object {
            node --test $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Windows test failure::$($_.Name)"
            }
          }
  worker-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test test/worker-budget.test.js
