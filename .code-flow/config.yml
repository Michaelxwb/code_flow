version: 1
spec_workflow:
  schema_version: 1
  enforcement: required
  drift_check: true
  scope_expansion_check: true
  metrics: true
  catalog:
    dedup_window: 5
budget:
  total: 2500
  l0_max: 800
  l1_max: 1700
  map_max: 400
  catalog_max: 200
quality_loop:
  enabled: true
  post_check: true
  stop_check: true
  correction_capture: true
  compress: true
  code_extensions:
  - .py
  - .ts
  - .tsx
  - .js
  - .jsx
  - .go
  - .java
  - .rs
  - .rb
  - .vue
  - .svelte
  skip_extensions:
  - .md
  - .txt
  - .json
  - .yml
  - .yaml
  - .toml
  - .lock
  - .csv
  - .xml
  - .svg
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .ico
  - .pdf
  - .zip
  - .gz
  - .tar
  skip_paths:
  - docs/**
  - '*.config.*'
  - .code-flow/**
  - .claude/**
  - .codex/**
  - .costrict/**
  - .opencode/**
  - node_modules/**
  - dist/**
  - build/**
  - out/**
  - coverage/**
  - .next/**
  - .cache/**
  - .venv/**
  - venv/**
  - __pycache__/**
  - .git/**
path_mapping:
  shared:
    specs:
    - path: shared/_map.md
      tags:
      - '*'
      tier: 0
    - path: shared/prd-template.md
      tags: []
      tier: 1
    - path: shared/design/design-lite.md
      tags: []
      tier: 1
    - path: shared/design/design-full.md
      tags: []
      tier: 1
    - path: shared/design/design-frontend.md
      tags: []
      tier: 1
  cli:
    patterns:
    - src/cli.js
    - src/adapters/**/*.json
    - src/adapters/**/*.toml
    specs:
    - path: cli/_map.md
      tags:
      - '*'
      tier: 0
    - path: cli/code-standards.md
      tags:
      - cli
      - init
      - upgrade
      - merge
      - platform
      - version
      - adapter
      tier: 1
  scripts:
    patterns:
    - src/core/code-flow/scripts/*.py
    - tests/*.py
    specs:
    - path: scripts/_map.md
      tags:
      - '*'
      tier: 0
    - path: scripts/code-standards.md
      tags:
      - hook
      - inject
      - config
      - spec
      - tag
      - scan
      - stats
      - session
      - log
      - performance
      - quality
      - test
      tier: 1
