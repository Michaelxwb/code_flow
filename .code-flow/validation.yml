# validators 在每次 Stop 按“会话内编辑过的文件”匹配执行（quality_loop.stop_check）。
# 全量测试 / e2e 等慢命令标 `heavy: true`：Stop 与任务 finish 都跳过（deferred_heavy），
# 只由需求终验 verify-e2e / 归档与显式 /cf-validate 全量执行一次；结果按工作树内容指纹
# 缓存，同一内容不会重复执行。
validators:
    - name: "Python 语法检查"
      trigger: "**/*.py"
      command: "python3 -m py_compile {files}"
      timeout: 30000
      on_fail: "检查语法错误"

    - name: "Pytest"
      trigger: "**/*.py"
      command: "python3 -m pytest --tb=short -q"
      timeout: 60000
      heavy: true
      on_fail: "测试失败，检查断言和 mock 是否需要更新"

    # 暂缺：cli.js 的 lint。项目目前未引入 ESLint，留位待补
