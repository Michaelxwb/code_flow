# validators 在每次 Stop 按“会话内编辑过的文件”匹配执行（quality_loop.stop_check）。
# 全量测试 / e2e 等慢命令标 `heavy: true`：Stop 每轮跳过，任务 finish 自动执行
# 一次，也可显式运行 /cf-validate；避免每个任务都重跑多遍。
validators:
    - name: "Python 语法检查"
      trigger: "**/*.py"
      command: "python3 -m py_compile {files}"
      timeout: 30000
      on_fail: "检查语法错误"

    - name: "Pytest"
      trigger: "**/*.py"
      command: "python3 -m pytest --tb=short -q"
      timeout: 60000
      heavy: true
      on_fail: "测试失败，检查断言和 mock 是否需要更新"

    # 暂缺：cli.js 的 lint。项目目前未引入 ESLint，留位待补
